<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">Vital-sign direction error distribution by primary cause</title>
  <desc id="desc">Grouped horizontal bar chart comparing former hybrid, pure LLM, original two-stage hybrid, calibrated v2, and calibrated v3 vital-direction errors across four primary cause categories. All configurations are scored on 159 corrected reviewed vital observations.</desc>
  <rect width="1600" height="1080" fill="#ffffff"/>

  <text x="60" y="55" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#17202a">Vital-Sign Error Distribution by Primary Cause</text>
  <text x="60" y="91" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#52606d">159 scored vital directions per configuration; current corrected reviewed labels</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#263238">
    <rect x="570" y="112" width="20" height="20" fill="#c85d37"/>
    <text x="603" y="128">Former hybrid (57 errors)</text>
    <rect x="920" y="112" width="20" height="20" fill="#237b78"/>
    <text x="953" y="128">Pure LLM (46 errors)</text>
    <rect x="1220" y="112" width="20" height="20" fill="#3f6fb6"/>
    <text x="1253" y="128">Two-stage (53 errors)</text>

    <rect x="740" y="150" width="20" height="20" fill="#8a5a9e"/>
    <text x="773" y="166">Two-stage calibrated v2 (69 errors)</text>
    <rect x="1110" y="150" width="20" height="20" fill="#d4a72c"/>
    <text x="1143" y="166">Two-stage calibrated v3 (49 errors)</text>
  </g>

  <g stroke="#d9e1e7" stroke-width="1">
    <line x1="540" y1="205" x2="540" y2="970"/>
    <line x1="790" y1="205" x2="790" y2="970"/>
    <line x1="1040" y1="205" x2="1040" y2="970"/>
    <line x1="1290" y1="205" x2="1290" y2="970"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#52606d" text-anchor="middle">
    <text x="540" y="994">0</text>
    <text x="790" y="994">10</text>
    <text x="1040" y="994">20</text>
    <text x="1290" y="994">30</text>
    <text x="990" y="1034" font-size="18" fill="#263238">Number of misclassified vital directions</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#263238">
    <text x="60" y="306" font-size="20" font-weight="600">Script-dependent or ambiguous</text>
    <rect x="540" y="226" width="650" height="20" fill="#c85d37"/>
    <rect x="540" y="254" width="625" height="20" fill="#237b78"/>
    <rect x="540" y="282" width="525" height="20" fill="#3f6fb6"/>
    <rect x="540" y="310" width="825" height="20" fill="#8a5a9e"/>
    <rect x="540" y="338" width="525" height="20" fill="#d4a72c"/>
    <text x="1202" y="242" font-size="16">26 (45.6%)</text>
    <text x="1177" y="270" font-size="16">25 (54.3%)</text>
    <text x="1077" y="298" font-size="16">21 (39.6%)</text>
    <text x="1377" y="326" font-size="16">33 (47.8%)</text>
    <text x="1077" y="354" font-size="16">21 (42.9%)</text>

    <text x="60" y="482" font-size="20" font-weight="600">Conservative or insufficient</text>
    <text x="60" y="508" font-size="20" font-weight="600">magnitude</text>
    <rect x="540" y="414" width="350" height="20" fill="#c85d37"/>
    <rect x="540" y="442" width="175" height="20" fill="#237b78"/>
    <rect x="540" y="470" width="50" height="20" fill="#3f6fb6"/>
    <rect x="540" y="498" width="175" height="20" fill="#8a5a9e"/>
    <rect x="540" y="526" width="100" height="20" fill="#d4a72c"/>
    <text x="902" y="430" font-size="16">14 (24.6%)</text>
    <text x="727" y="458" font-size="16">7 (15.2%)</text>
    <text x="602" y="486" font-size="16">2 (3.8%)</text>
    <text x="727" y="514" font-size="16">7 (10.1%)</text>
    <text x="652" y="542" font-size="16">4 (8.2%)</text>

    <text x="60" y="672" font-size="20" font-weight="600">Dead-zone or point-target</text>
    <text x="60" y="698" font-size="20" font-weight="600">boundary</text>
    <rect x="540" y="604" width="250" height="20" fill="#c85d37"/>
    <rect x="540" y="632" width="225" height="20" fill="#237b78"/>
    <rect x="540" y="660" width="425" height="20" fill="#3f6fb6"/>
    <rect x="540" y="688" width="250" height="20" fill="#8a5a9e"/>
    <rect x="540" y="716" width="325" height="20" fill="#d4a72c"/>
    <text x="802" y="620" font-size="16">10 (17.5%)</text>
    <text x="777" y="648" font-size="16">9 (19.6%)</text>
    <text x="977" y="676" font-size="16">17 (32.1%)</text>
    <text x="802" y="704" font-size="16">10 (14.5%)</text>
    <text x="877" y="732" font-size="16">13 (26.5%)</text>

    <text x="60" y="860" font-size="20" font-weight="600">Action semantics or clinical</text>
    <text x="60" y="886" font-size="20" font-weight="600">reasoning</text>
    <rect x="540" y="792" width="175" height="20" fill="#c85d37"/>
    <rect x="540" y="820" width="125" height="20" fill="#237b78"/>
    <rect x="540" y="848" width="325" height="20" fill="#3f6fb6"/>
    <rect x="540" y="876" width="475" height="20" fill="#8a5a9e"/>
    <rect x="540" y="904" width="275" height="20" fill="#d4a72c"/>
    <text x="727" y="808" font-size="16">7 (12.3%)</text>
    <text x="677" y="836" font-size="16">5 (10.9%)</text>
    <text x="877" y="864" font-size="16">13 (24.5%)</text>
    <text x="1027" y="892" font-size="16">19 (27.5%)</text>
    <text x="827" y="920" font-size="16">11 (22.4%)</text>
  </g>

  <text x="60" y="1065" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#667784">One primary cause per misclassified vital. Percentages use each configuration's own error count as denominator.</text>
</svg>
